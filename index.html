<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog - Jama Masjid Khuteri Jamaat Khana Utensil Rental</title>
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/catalog.css">
<link rel="stylesheet" href="/index.css">
</head>
<body>

  <!-- Header Banner -->
  <header class="catalog-header">
    <div class="header-inner">
      <a href="index.html" class="brand-wrapper">
        <img src="assets/logo.png" alt="Jama Masjid Khuteri Logo" class="brand-logo" onerror="this.src='./assets/logo.png'">
        <div>
          <h1 class="brand-title">Jama Masjid Khuteri Jamaat Khana</h1>
          <p class="brand-subtitle">Bartan & Catering Equipment Rental Catalog</p>
        </div>
      </a>

      <div class="header-contacts">
        <div class="contact-pill">
          <span>📍 Gram Khuteri, Dist. Durg (C.G.)</span>
        </div>
        <div class="contact-pill">
          <span>📞 Helpline: +91 98765 43210</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Quick Package Helper -->
  <section style="background: #FEF3C7; border-bottom: 1px solid #FCD34D; padding: 0.625rem 1rem;">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.8125rem;">
      <div style="font-weight: 700; color: #92400E; display: flex; align-items: center; gap: 0.375rem;">
        <span>🎉 Quick Event Offer Packages:</span>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button onclick="loadPresetPackage('50_guests')" class="btn btn-sm" style="background: #F59E0B; color: #FFF; border: none; font-size: 0.75rem; padding: 0.25rem 0.625rem;">
          50 People Niyaz Package
        </button>
        <button onclick="loadPresetPackage('150_guests')" class="btn btn-sm" style="background: #D97706; color: #FFF; border: none; font-size: 0.75rem; padding: 0.25rem 0.625rem;">
          150 People Dawat Package
        </button>
      </div>
    </div>
  </section>

  <!-- Main Toolbar (Search & Category Tabs) -->
  <div class="catalog-toolbar">
    <div class="search-and-presets">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="form-control" placeholder="Search item name (e.g. Deg, Plate, Balti, Bhatti)...">
      </div>
    </div>

    <div class="categories-scroll" id="category-tabs">
      <!-- Category tabs rendered dynamically via catalog.js -->
    </div>
  </div>

  <!-- Item Grid -->
  <main class="catalog-container">
    <div class="item-grid" id="item-grid">
      <!-- Cards rendered dynamically via catalog.js -->
    </div>
  </main>

  <!-- Floating Sticky Bottom Cart Bar -->
  <div class="floating-cart-bar empty" id="floating-cart-bar">
    <div class="cart-bar-inner">
      <div class="cart-summary-text">
        <span class="cart-count-badge" id="cart-items-count">0 Items Selected</span>
        <div class="cart-total-amount">
          Total Rent: <span id="cart-total-price">₹0</span>
        </div>
      </div>

      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn btn-secondary btn-sm" id="btn-clear-cart" title="Clear Cart">
          Clear
        </button>
        <button class="btn btn-accent btn-lg" id="btn-checkout">
          View Cart & Checkout ➔
        </button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
